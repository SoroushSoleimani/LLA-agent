<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLa</title>
<style>
:root{color-scheme:light dark;--bg:#faf9f7;--card:#fff;--text:#1f1e1d;--muted:#6b6a67;--line:#e4e2dd;--accent:#534ab7;--accent-soft:#eeedfe;--me:#534ab7;--me-text:#fff;--ok:#0f6e56;--danger:#a32d2d}
@media(prefers-color-scheme:dark){:root{--bg:#1c1b1a;--card:#262524;--text:#f1efe9;--muted:#a09e98;--line:#3a3836;--accent:#9b94ee;--accent-soft:#33305a;--me:#534ab7;--me-text:#fff;--ok:#5dcaa5;--danger:#f09595}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:300px 1fr;height:100vh;height:100dvh}
aside{border-right:1px solid var(--line);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:16px}
aside h2{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:.2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.brand{font-size:20px;font-weight:500}
.brand small{display:block;font-size:13px;color:var(--muted);font-weight:400}
main{display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header .sp{flex:1}
label.tog{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
select,button,input[type=text]{font:inherit;color:var(--text)}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px}
button{cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(720px,88%);padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--me);color:var(--me-text);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.status{align-self:flex-start;color:var(--muted);font-size:14px;padding:2px 4px}
.approval{align-self:flex-start;max-width:min(720px,88%);background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px 14px}
.approval pre{margin:6px 0 10px;white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,monospace}
.approval .row{display:flex;gap:8px}
.approval .done{font-size:14px;color:var(--muted)}
.btn-ok{background:var(--ok);color:#fff;border:0;border-radius:8px;padding:8px 14px}
.btn-no{background:none;color:var(--danger);border:1px solid var(--danger);border-radius:8px;padding:8px 14px}
.chips{display:flex;gap:8px;padding:0 16px 8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);padding-bottom:max(12px,env(safe-area-inset-bottom))}
.composer input{flex:1;min-width:0;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:16px}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:14px}
.icon.on{background:var(--danger);color:#fff;border-color:var(--danger)}
.send{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:0 18px;font-size:15px}
.send:disabled{opacity:.5}
@media(max-width:760px){
 .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 aside{border-right:0;border-bottom:1px solid var(--line);max-height:34vh;padding:10px 12px;gap:10px}
 .brand small{display:none}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand">LLa<small>Your personal assistant</small></div>
  <section><h2>Today's calendar</h2><div class="panel" id="events">Loading...</div></section>
  <section><h2>Open tasks</h2><div class="panel" id="tasks">Loading...</div></section>
  <button class="ghost" id="refresh" type="button">Refresh</button>
</aside>
<main>
  <header>
    <label class="tog"><input type="checkbox" id="speakToggle"> Speak replies</label>
    <select id="lang" aria-label="Voice language">
      <option value="en-US">English</option>
      <option value="fa-IR">Persian</option>
      <option value="ar-SA">Arabic</option>
      <option value="tr-TR">Turkish</option>
      <option value="es-ES">Spanish</option>
      <option value="fr-FR">French</option>
      <option value="de-DE">German</option>
    </select>
    <span class="sp"></span>
    <form method="post" action="/logout"><button class="ghost" type="submit">Sign out</button></form>
  </header>
  <div id="chat" aria-live="polite"></div>
  <div class="chips">
    <button class="chip" type="button" data-q="Make my plan for today. Check my calendar, tasks and unread emails.">Plan my day</button>
    <button class="chip" type="button" data-q="Any important unread emails?">Check emails</button>
    <button class="chip" type="button" data-q="What is on my calendar this week?">This week</button>
    <button class="chip" type="button" data-q="What are my open tasks?">My tasks</button>
  </div>
  <form class="composer" id="form">
    <button class="icon" id="mic" type="button" aria-label="Speak">Mic</button>
    <input type="text" id="input" placeholder="Message LLa..." autocomplete="off" aria-label="Message">
    <button class="send" id="send" type="submit" disabled>Send</button>
  </form>
</main>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const micBtn = document.getElementById('mic');
const speakToggle = document.getElementById('speakToggle');
const langSel = document.getElementById('lang');
let ws = null, statusEl = null;

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
speakToggle.checked = store('speak') === '1';
if (store('lang')) langSel.value = store('lang');
speakToggle.onchange = () => store('speak', speakToggle.checked ? '1' : '0');
langSel.onchange = () => store('lang', langSel.value);

function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
function addMsg(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  d.dir = 'auto';
  chat.appendChild(d); scrollDown(); return d;
}
function clearStatus(){ if(statusEl){ statusEl.remove(); statusEl = null; } }

function addApproval(m){
  const box = document.createElement('div');
  box.className = 'approval';
  const title = document.createElement('div');
  title.textContent = 'LLa wants to run: ' + m.name;
  const pre = document.createElement('pre');
  pre.textContent = JSON.stringify(m.args, null, 2);
  const row = document.createElement('div'); row.className = 'row';
  const ok = document.createElement('button'); ok.className = 'btn-ok'; ok.type = 'button'; ok.textContent = 'Approve';
  const no = document.createElement('button'); no.className = 'btn-no'; no.type = 'button'; no.textContent = 'Cancel';
  const answer = (approved) => {
    ws.send(JSON.stringify({type:'approval_reply', id:m.id, approved}));
    row.remove();
    const done = document.createElement('div'); done.className = 'done';
    done.textContent = approved ? 'Approved.' : 'Cancelled.';
    box.appendChild(done);
  };
  ok.onclick = () => answer(true); no.onclick = () => answer(false);
  row.append(ok, no);
  box.append(title, pre, row);
  chat.appendChild(box); scrollDown();
}

function speak(text){
  if(!speakToggle.checked || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = langSel.value;
  speechSynthesis.speak(u);
}

function connect(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.onopen = () => { sendBtn.disabled = false; };
  ws.onclose = () => { sendBtn.disabled = true; setTimeout(connect, 2000); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'status'){ clearStatus(); statusEl = addMsg('status', m.text); }
    else if (m.type === 'reply'){ clearStatus(); addMsg('bot', m.text); speak(m.text); loadToday(); }
    else if (m.type === 'approval'){ clearStatus(); addApproval(m); }
  };
}

function sendText(text){
  text = text.trim();
  if(!text || !ws || ws.readyState !== 1) return;
  addMsg('me', text);
  ws.send(JSON.stringify({type:'message', text}));
}
document.getElementById('form').onsubmit = (e) => { e.preventDefault(); sendText(input.value); input.value = ''; };
document.querySelectorAll('.chip').forEach(c => c.onclick = () => sendText(c.dataset.q));

async function loadToday(){
  try{
    const r = await fetch('/api/today');
    if (r.status === 401){ location.reload(); return; }
    const d = await r.json();
    document.getElementById('events').textContent = d.events;
    document.getElementById('tasks').textContent = d.tasks;
  }catch(e){
    document.getElementById('events').textContent = 'Could not load.';
  }
}
document.getElementById('refresh').onclick = loadToday;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (!SR){ micBtn.disabled = true; micBtn.title = 'Voice input is not supported in this browser (try Chrome, Edge or Safari)'; }
micBtn.onclick = () => {
  if (listening){ rec && rec.stop(); return; }
  speechSynthesis && speechSynthesis.cancel();
  rec = new SR();
  rec.lang = langSel.value;
  rec.interimResults = false;
  rec.onstart = () => { listening = true; micBtn.classList.add('on'); micBtn.textContent = 'Stop'; };
  rec.onend = () => { listening = false; micBtn.classList.remove('on'); micBtn.textContent = 'Mic'; };
  rec.onerror = () => {};
  rec.onresult = (e) => { sendText(e.results[0][0].transcript); };
  rec.start();
};

connect();
loadToday();
addMsg('bot', 'Hi, I am LLa. Ask me about your calendar, email or tasks, or tap "Plan my day".');
</script>
</body>
</html>
