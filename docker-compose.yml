services:
  # Telegram bot + morning plan
  lla:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data   # holds token.json and the task database
    restart: unless-stopped

  # Web interface. Only reachable from the server itself (127.0.0.1).
  # Put HTTPS in front of it (see README) or use an SSH tunnel.
  web:
    build: .
    command: uvicorn web:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
